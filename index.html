<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリ一覧</title>
<meta name="description" content="公開している Android アプリの一覧です。">
<style>
  :root {
    color-scheme: light;
    --bg: #F7F5F2;
    --card: #FFFFFF;
    --ink: #2E2A26;
    --muted: #6F665E;
    --line: #E6E0D9;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  header { padding: 64px 0 32px; }
  h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); letter-spacing: .04em; }
  .lead { margin: 8px 0 0; color: var(--muted); }

  /* ---- アプリの一覧(カードは自動で折り返して並ぶ) ---- */
  .apps {
    list-style: none; margin: 0; padding: 0 0 64px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
  }
  .app {
    --accent: #555;  /* アプリごとに上書きする色(ボタンなど) */
    display: grid; grid-template-columns: 88px 1fr; gap: 18px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px;
    border-top: 5px solid var(--accent);
  }
  .app img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .app h2 { margin: 0; font-size: 1.2rem; line-height: 1.4; }
  .app p { margin: 4px 0 14px; color: var(--muted); font-size: .92rem; }
  .app a {
    display: inline-block; padding: 8px 20px; border-radius: 999px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: .92rem;
  }
  .app a:hover { filter: brightness(.9); }
  .app a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  footer { border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: .9rem; }

  @media (max-width: 480px) {
    .wrap { padding: 0 16px; }
    header { padding: 40px 0 24px; }
    .app { grid-template-columns: 64px 1fr; gap: 14px; padding: 18px; }
    .app img { width: 64px; height: 64px; border-radius: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>アプリ一覧</h1>
    <p class="lead">公開している Android アプリです。</p>
  </div>
</header>

<main class="wrap">
  <!--
    アプリを追加するときは、下の <li class="app"> ～ </li> をまるごとコピーして書き換える。
      - href      : アプリページのフォルダ(例: "justmath/")
      - img src   : アイコン(各アプリのフォルダの images/icon-192.png に置く)
      - --accent  : 上の線とボタンの色(アプリのメインカラー)
      - h2 / p    : アプリ名と一言の説明
    並び順は、ここに書いた順になる。
  -->
  <ul class="apps">
    <li class="app" style="--accent: #B8481C">
      <img src="myrecipe/images/icon-192.png" alt="" width="88" height="88">
      <div>
        <h2>うちの献立</h2>
        <p>よく作る料理を貯めて、毎日の献立を記録するアプリ</p>
        <a href="myrecipe/">詳しく見る</a>
      </div>
    </li>
  </ul>
</main>

<footer>
  <div class="wrap">&copy; 2026</div>
</footer>

</body>
</html>
